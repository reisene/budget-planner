name: Bug report
description: Report something that is not working as expected
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security issues, please use private vulnerability reporting (see SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: input
    id: environment
    attributes:
      label: Browser / OS
      placeholder: Firefox 130 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output or drag in screenshots.
